name: Publish npm Package

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'npm-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Setup
        shell: bash
        run: make setup

      - name: Test SDK
        working-directory: lib
        run: bun test

      - name: Verify package
        working-directory: lib
        run: npm pack --dry-run

      - name: Publish package
        working-directory: lib
        run: npm publish --access public --provenance
