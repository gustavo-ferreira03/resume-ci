    position: Engenheiro de Software
    startDate: 2019-06
    endDate: 2021-12
    url: https://retail.example.invalid
    summary: Desenvolvi funcionalidades de gestão de pedidos e integrações backend para inventário, fulfillment e suporte ao cliente.
    highlights:
      - Construí um painel de exceções de entrega com **Vue.js**, **Express.js** e **MySQL**, dando ao suporte uma fila única para pedidos atrasados e decisões de reembolso.
      - Automatizei jobs noturnos de reconciliação de estoque em **Python**, reduzindo a revisão em planilhas de 4 horas para 45 minutos para o time de operações.
      - Adicionei logs estruturados e alertas em webhooks de pagamento, encurtando a triagem de capturas com falha de horas para minutos.

